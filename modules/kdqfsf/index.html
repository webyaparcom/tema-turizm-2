<style>
  /* deger-pano-tabela — deger-tablo açık zeminli ikon-başlık-metin tablosudur, deger-ilke-kanit iki sütunu çizgiyle eşler; bu modül koyu pano iskeleti kurar (kod kutusu + bölünmüş palet hücresi + ışıklı durum sütunu) ve satırlar X ekseninde dönerek gelir. */
  .modulex-deger-pano-tabela { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-deger-pano-tabela *, .modulex-deger-pano-tabela *::before, .modulex-deger-pano-tabela *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-deger-pano-tabela :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */

  .modulex-deger-pano-tabela img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-deger-pano-tabela) img { height: auto; }
  .modulex-deger-pano-tabela [hidden] { display: none !important; }
  .modulex-deger-pano-tabela :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-deger-pano-tabela :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-deger-pano-tabela-ic { max-width: --max--; margin-inline: auto; }
  .modulex-deger-pano-tabela-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-deger-pano-tabela--bassiz .modulex-deger-pano-tabela-bas { display: none; }
  .modulex-deger-pano-tabela-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-deger-pano-tabela-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }

  .modulex-deger-pano-tabela-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-deger-pano-tabela-ust { grid-column: 1 / -1; }
  .modulex-deger-pano-tabela-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-deger-pano-tabela-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-deger-pano-tabela-dugme:hover { transform: translateY(-2px); }
  .modulex-deger-pano-tabela-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-deger-pano-tabela-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-deger-pano-tabela-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-deger-pano-tabela-pano { padding: clamp(14px, 2vw, 22px); border: 1px solid --cizgi--; border-radius: calc(--yuvarlak-- * 0.8); background: color-mix(in srgb, --text-- 5%, --bg--); box-shadow: inset 0 2px 0 color-mix(in srgb, --text-- 8%, transparent), 0 30px 60px -40px black; }
  .modulex-deger-pano-tabela-tepe, .modulex-deger-pano-tabela-satir { display: grid; grid-template-columns: 84px minmax(0, 1fr) minmax(150px, auto); align-items: center; gap: 18px; }
  .modulex-deger-pano-tabela-tepe { position: relative; padding-block: 4px 12px; padding-inline: 6px 30px; border-block-end: 1px solid --cizgi--; }
  .modulex-deger-pano-tabela-sbas { color: --muted--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 0.74rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
  .modulex-deger-pano-tabela-lamba { position: absolute; inset-block-start: 6px; inset-inline-end: 6px; width: 10px; height: 10px; border-radius: 50%; background: --accent--; box-shadow: 0 0 10px --accent--; animation: modulex-deger-pano-tabela-yan 1.8s ease-in-out infinite; }
  .modulex-deger-pano-tabela-satirlar { display: grid; perspective: 900px; }
  .modulex-deger-pano-tabela-satir { position: relative; padding: 16px 6px; border-block-end: 1px solid color-mix(in srgb, --text-- 8%, transparent); transform-origin: 50% 0; transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) calc(var(--i) * 0.14s), background-color 0.25s ease; }
  .modulex-deger-pano-tabela--hazir:not(.modulex-deger-pano-tabela--gor) .modulex-deger-pano-tabela-satir { transform: rotateX(-88deg); }
  .modulex-deger-pano-tabela-satir:hover, .modulex-deger-pano-tabela-satir:focus-within { background-color: color-mix(in srgb, --accent-- 10%, transparent); }
  .modulex-deger-pano-tabela-kod { display: grid; place-items: center; height: 56px; border-radius: 6px; background: --accent--; color: --accentText--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 1.6rem; font-weight: 800; }
  .modulex-deger-pano-tabela-ana { display: grid; gap: 8px; }
  .modulex-deger-pano-tabela-palet { position: relative; width: fit-content; max-width: 100%; padding: 6px 14px; border-radius: 4px; background: color-mix(in srgb, --text-- 11%, --bg--); isolation: isolate; }
  .modulex-deger-pano-tabela-palet::after { content: ""; position: absolute; inset-inline: 0; inset-block-start: 50%; z-index: -1; height: 2px; background: color-mix(in srgb, --bg-- 80%, transparent); }
  .modulex-deger-pano-tabela-kbaslik { font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: clamp(1.1rem, 1.9vw, 1.45rem); font-weight: 700; letter-spacing: 0.06em; line-height: 1.3; text-transform: uppercase; }
  .modulex-deger-pano-tabela-kmetin { color: --muted--; font-size: 0.94rem; }
  .modulex-deger-pano-tabela-durum { display: flex; align-items: center; gap: 8px; color: --accentInk--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .modulex-deger-pano-tabela-durum::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: --accent--; animation: modulex-deger-pano-tabela-yan 1.8s ease-in-out calc(var(--i) * 0.3s) infinite; }
  .modulex-deger-pano-tabela-dikon { font-size: 20px; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) :is(.modulex-deger-pano-tabela-kbaslik, .modulex-deger-pano-tabela-durum, .modulex-deger-pano-tabela-sbas) { font-family: inherit; letter-spacing: 0; }
  @keyframes modulex-deger-pano-tabela-yan { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (max-width: 768px) {
    .modulex-deger-pano-tabela-tepe { display: none; }
    .modulex-deger-pano-tabela-satir { grid-template-columns: 52px minmax(0, 1fr); gap: 8px 14px; align-items: start; }
    .modulex-deger-pano-tabela-kod { height: 44px; font-size: 1.2rem; }
    .modulex-deger-pano-tabela-durum { grid-column: 2; }
  }
  .modulex-deger-pano-tabela-bag { color: inherit; text-decoration: none; }
  .modulex-deger-pano-tabela-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-deger-pano-tabela-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-pano-tabela :is(.modulex-deger-pano-tabela-baslik, .modulex-deger-pano-tabela-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-pano-tabela-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-deger-pano-tabela-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-deger-pano-tabela { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-deger-pano-tabela *, .modulex-deger-pano-tabela *::before, .modulex-deger-pano-tabela *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-deger-pano-tabela";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
