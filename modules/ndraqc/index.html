<style>
  /* acilis-bilet — acilis-cagri-kutusu ve acilis-cam-panel metni düz bir kutuya alır; bu modül açılışı bilet biçimine sokar — afiş + gövde + delikli koçan üç parçalı iskelet, maddeler bilet haneleri, imleçle 3B eğim. fuar-geri-sayim tarih sayar, burada tarih koçandaki rozettir. */
  .modulex-acilis-bilet { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-acilis-bilet *, .modulex-acilis-bilet *::before, .modulex-acilis-bilet *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-acilis-bilet :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-acilis-bilet :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-acilis-bilet :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-acilis-bilet :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-acilis-bilet img { display: block; max-width: 100%; }

  :where(.modulex-acilis-bilet) img { height: auto; }
  .modulex-acilis-bilet [hidden] { display: none !important; }
  .modulex-acilis-bilet :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-acilis-bilet :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-acilis-bilet-ic { max-width: --max--; margin-inline: auto; }

  .modulex-acilis-bilet-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-acilis-bilet-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-acilis-bilet-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-acilis-bilet-dugme:hover { transform: translateY(-2px); }
  .modulex-acilis-bilet-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-acilis-bilet-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-acilis-bilet-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-acilis-bilet-bilet { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 0.34fr); border-radius: calc(--yuvarlak-- * 1.2); background-color: --kartBg--; box-shadow: 0 50px 90px -60px color-mix(in srgb, --text-- 85%, transparent), 0 0 0 1px --cizgi--; transform: perspective(1400px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .modulex-acilis-bilet-bilet--kocansiz { grid-template-columns: minmax(0, 1fr); }
  .modulex-acilis-bilet-ana { display: grid; grid-template-columns: minmax(0, 0.72fr) minmax(0, 1.28fr); gap: clamp(20px, 3vw, 40px); align-items: center; padding: clamp(16px, 2.4vw, 28px); }
  .modulex-acilis-bilet-ana--afissiz { grid-template-columns: minmax(0, 1fr); padding: clamp(24px, 4vw, 52px); }
  .modulex-acilis-bilet-afis { margin: 0; overflow: hidden; border-radius: --yuvarlak--; }
  .modulex-acilis-bilet-afoto { inline-size: 100%; aspect-ratio: 4 / 5; object-fit: cover; transition: transform 0.7s ease; }
  .modulex-acilis-bilet-bilet:hover .modulex-acilis-bilet-afoto { transform: scale(1.04); }
  .modulex-acilis-bilet-bilgi { display: grid; gap: 16px; justify-items: start; min-width: 0; padding-block: 12px; }
  .modulex-acilis-bilet-bilgi .modulex-acilis-bilet-h1 { font-size: clamp(2rem, 4.2vw, 3.6rem); }
  .modulex-acilis-bilet-kocan { position: relative; display: grid; align-content: space-between; gap: 22px; padding: clamp(22px, 3vw, 32px); border-inline-start: 2px dashed --cizgi--; animation: modulex-acilis-bilet-koc 0.9s 0.25s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes modulex-acilis-bilet-koc { from { opacity: 0; transform: translateX(18px) rotate(2deg); } to { opacity: 1; transform: none; } }
  .modulex-acilis-bilet-kocan::before, .modulex-acilis-bilet-kocan::after { content: ""; position: absolute; inset-inline-start: -15px; inline-size: 28px; block-size: 28px; border-radius: 50%; background-color: --bg--; }
  .modulex-acilis-bilet-kocan::before { inset-block-start: -14px; }
  .modulex-acilis-bilet-kocan::after { inset-block-end: -14px; }
  .modulex-acilis-bilet-tarih { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 12px; padding-block-end: 18px; border-block-end: 1px solid --cizgi--; }
  .modulex-acilis-bilet-tarih .modulex-acilis-bilet-rikon { grid-row: span 2; display: inline-grid; place-items: center; inline-size: 48px; block-size: 48px; border-radius: 12px; background-color: --accent--; color: --accentText--; font-size: 26px; }
  .modulex-acilis-bilet-tarih .modulex-acilis-bilet-rdeger { font-family: var(--mx-font-heading, inherit); font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .modulex-acilis-bilet-tarih .modulex-acilis-bilet-rmetin { color: --muted--; font-size: 0.88rem; }
  .modulex-acilis-bilet-haneler { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
  .modulex-acilis-bilet-hane { display: grid; gap: 2px; min-width: 0; }
  .modulex-acilis-bilet-hetiket { display: inline-flex; align-items: center; gap: 4px; color: --muted--; font-size: 0.72rem; font-weight: 750; letter-spacing: 0.1em; text-transform: uppercase; }
  .modulex-acilis-bilet-hikon { font-size: 15px; }
  .modulex-acilis-bilet-hdeger { font-size: 1.35rem; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .modulex-acilis-bilet-barkod { display: block; block-size: 54px; border-radius: 4px; background: repeating-linear-gradient(90deg, --text-- 0 2px, transparent 2px 5px, --text-- 5px 6px, transparent 6px 8px, --text-- 8px 11px, transparent 11px 13px); opacity: 0.85; }
  .modulex-acilis-bilet-parilti { position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle at var(--px, 50%) var(--py, 0%), color-mix(in srgb, --kartBg-- 45%, transparent), transparent 45%); visibility: hidden; pointer-events: none; }
  .modulex-acilis-bilet-bilet:hover .modulex-acilis-bilet-parilti { visibility: visible; }
  @media (max-width: 1024px) {
    .modulex-acilis-bilet-bilet { grid-template-columns: minmax(0, 1fr); }
    .modulex-acilis-bilet-kocan { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: center; border-inline-start: 0; border-block-start: 2px dashed --cizgi--; }
    .modulex-acilis-bilet-kocan::before { inset-block-start: -15px; inset-inline-start: -14px; }
    .modulex-acilis-bilet-kocan::after { inset-block-start: -15px; inset-block-end: auto; inset-inline-start: auto; inset-inline-end: -14px; }
    .modulex-acilis-bilet-barkod { grid-column: 1 / -1; }
  }
  @media (max-width: 768px) {
    .modulex-acilis-bilet-ana { grid-template-columns: minmax(0, 1fr); }
    .modulex-acilis-bilet-afoto { aspect-ratio: 16 / 10; }
    .modulex-acilis-bilet-kocan { grid-template-columns: minmax(0, 1fr); }
    .modulex-acilis-bilet-tarih .modulex-acilis-bilet-rdeger { font-size: 1.6rem; }
  }
  .modulex-acilis-bilet-h1 { font-family: var(--mx-font-heading, inherit); font-size: clamp(2.3rem, 5.2vw, 4.2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; text-wrap: balance; }
  .modulex-acilis-bilet-metin { color: --muted--; font-size: clamp(1.02rem, 1.3vw, 1.18rem); line-height: 1.7; max-width: 62ch; }
  .modulex-acilis-bilet-ogeler { display: flex; flex-wrap: wrap; gap: 14px 30px; }
  .modulex-acilis-bilet-oge { display: flex; align-items: center; gap: 10px; }
  .modulex-acilis-bilet-oikon { color: --accentInk--; font-size: 22px; }
  .modulex-acilis-bilet-odeger { font-size: 1.45rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .modulex-acilis-bilet-ometin { color: --muted--; font-size: 0.95rem; }
  .modulex-acilis-bilet-obag { color: inherit; text-underline-offset: 3px; }
  .modulex-acilis-bilet-gir { animation: modulex-acilis-bilet-gir 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes modulex-acilis-bilet-gir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-acilis-bilet-h1 { letter-spacing: 0; line-height: 1.3; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-acilis-bilet :is(.modulex-acilis-bilet-baslik, .modulex-acilis-bilet-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-acilis-bilet-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-acilis-bilet { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-acilis-bilet *, .modulex-acilis-bilet *::before, .modulex-acilis-bilet *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-acilis-bilet";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const biletEgim = (s, P, az) => {
        const b = s.querySelector("[data-egim]");
        if (!b || az || !(window.matchMedia && window.matchMedia("(hover: hover)").matches)) return;
        b.addEventListener("pointermove", (e) => {
          const r = b.getBoundingClientRect();
          const x = (e.clientX - r.x) / (r.width || 1) - 0.5;
          const y = (e.clientY - r.y) / (r.height || 1) - 0.5;
          b.style.setProperty("--ry", (x * 7).toFixed(2) + "deg");
          b.style.setProperty("--rx", (-y * 7).toFixed(2) + "deg");
          b.style.setProperty("--px", ((x + 0.5) * 100).toFixed(1) + "%");
          b.style.setProperty("--py", ((y + 0.5) * 100).toFixed(1) + "%");
        });
        b.addEventListener("pointerleave", () => { b.style.setProperty("--rx", "0deg"); b.style.setProperty("--ry", "0deg"); });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      biletEgim(s, P, az);
    });
  })();
</script>
