<section class="modulex-zaman-hikaye{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-zaman-hikaye-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* zaman-hikaye — zaman-sekme-yil ve zaman-kurulus-surgu da tek dönem gösterir ama kullanıcı seçene dek durur; zaman-hikaye zamanlı otomatik ilerleyen (bölüt ilerleme şeritli) dikey kare oynatıcıdır, halka avatarlarla gezilir ve duraklatılır — vitrin/mağaza markalarının hikâye dili; film-seridi/ray yatay kaydırmadır. */
  .modulex-zaman-hikaye { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-zaman-hikaye *, .modulex-zaman-hikaye *::before, .modulex-zaman-hikaye *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-zaman-hikaye :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-zaman-hikaye :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-zaman-hikaye :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-zaman-hikaye :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-zaman-hikaye img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-zaman-hikaye) img { height: auto; }
  .modulex-zaman-hikaye [hidden] { display: none !important; }
  .modulex-zaman-hikaye :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-zaman-hikaye :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-zaman-hikaye-ic { max-width: --max--; margin-inline: auto; }
  .modulex-zaman-hikaye-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-zaman-hikaye--bassiz .modulex-zaman-hikaye-bas { display: none; }
  .modulex-zaman-hikaye-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-zaman-hikaye-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-zaman-hikaye-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-zaman-hikaye-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-zaman-hikaye-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-zaman-hikaye-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-zaman-hikaye-dugme:hover { transform: translateY(-2px); }
  .modulex-zaman-hikaye-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-zaman-hikaye-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-zaman-hikaye-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-zaman-hikaye-hikaye { display: grid; gap: 28px; }
  .modulex-zaman-hikaye--js .modulex-zaman-hikaye-hikaye { grid-template-columns: minmax(0, 420px) minmax(0, 1fr); align-items: center; gap: clamp(28px, 5vw, 72px); }
  .modulex-zaman-hikaye-halkalar { display: grid; gap: 8px; }
  .modulex-zaman-hikaye--js .modulex-zaman-hikaye-halkalar { grid-column: 2; grid-row: 1; }
  .modulex-zaman-hikaye-halka { position: relative; display: flex; align-items: center; gap: 16px; width: 100%; padding: 10px 14px; border: 0; border-radius: 18px; background-color: transparent; color: --text--; font: inherit; text-align: start; transition: background-color 0.25s ease, box-shadow 0.25s ease; }
  .modulex-zaman-hikaye-halka:hover { background-color: color-mix(in srgb, --accent-- 8%, transparent); }
  .modulex-zaman-hikaye-halka[aria-current] { background-color: --kartBg--; box-shadow: 0 14px 28px -22px color-mix(in srgb, --text-- 70%, transparent); }
  .modulex-zaman-hikaye-yuz { flex: none; display: grid; width: 66px; height: 66px; padding: 3px; border-radius: 50%; background-image: conic-gradient(--accent--, color-mix(in srgb, --accent-- 35%, --text--), --accent--); transition: transform 0.3s ease; }
  .modulex-zaman-hikaye-halka:hover .modulex-zaman-hikaye-yuz { transform: scale(1.06); }
  .modulex-zaman-hikaye-halka.modulex-zaman-hikaye--goruldu .modulex-zaman-hikaye-yuz { background-image: none; background-color: --cizgi--; }
  .modulex-zaman-hikaye-yuzimg, .modulex-zaman-hikaye-yuzikon { width: 100%; height: 100%; border: 3px solid --bg--; border-radius: 50%; object-fit: cover; }
  .modulex-zaman-hikaye-yuzikon { display: grid; place-items: center; background-color: --kartBg--; color: --accentInk--; font-size: 26px; }
  .modulex-zaman-hikaye-hmetin { display: grid; gap: 2px; min-width: 0; }
  .modulex-zaman-hikaye-hyil { color: --accentInk--; font-size: 0.85rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-zaman-hikaye-hbaslik { font-weight: 700; line-height: 1.3; }
  .modulex-zaman-hikaye--js .modulex-zaman-hikaye-oynatici { grid-column: 1; grid-row: 1; }
  .modulex-zaman-hikaye-sahne { position: relative; }
  .modulex-zaman-hikaye-kareler { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 18px; }
  .modulex-zaman-hikaye--js .modulex-zaman-hikaye-kareler { display: block; }
  .modulex-zaman-hikaye-kare { position: relative; display: grid; align-content: end; min-height: 340px; overflow: hidden; border-radius: calc(--yuvarlak-- * 1.3); background-color: --vurguBg--; color: --vurguText--; isolation: isolate; }
  .modulex-zaman-hikaye--js .modulex-zaman-hikaye-kare { min-height: 0; aspect-ratio: 4 / 5; animation: modulex-zaman-hikaye-kare 0.5s ease both; }
  .modulex-zaman-hikaye-kare::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(color-mix(in srgb, --vurguText-- 18%, transparent) 1.5px, transparent 2px); background-size: 18px 18px; }
  .modulex-zaman-hikaye-kare--gorsel { color: white; }
  .modulex-zaman-hikaye-kare--gorsel::before { z-index: 0; background-image: linear-gradient(to bottom, rgb(0 0 0 / 0.45), transparent 22%), linear-gradient(to top, rgb(0 0 0 / 0.84), rgb(0 0 0 / 0.3) 58%, transparent); background-size: auto; }
  .modulex-zaman-hikaye-gorsel { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; object-fit: cover; }
  .modulex-zaman-hikaye-yazi { position: relative; z-index: 1; display: grid; gap: 8px; padding: 64px clamp(22px, 3vw, 32px) clamp(22px, 3vw, 32px); }
  .modulex-zaman-hikaye-yil { font-size: clamp(2.6rem, 6vw, 4rem); font-weight: 900; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .modulex-zaman-hikaye-kbaslik { font-size: 1.45rem; font-weight: 780; line-height: 1.25; }
  .modulex-zaman-hikaye-kmetin { font-size: 1rem; line-height: 1.6; }
  .modulex-zaman-hikaye-seritler { position: absolute; inset-block-start: 14px; inset-inline: 14px; z-index: 2; display: flex; gap: 5px; }
  .modulex-zaman-hikaye-serit { flex: 1; height: 4px; overflow: hidden; border-radius: 4px; background-color: rgb(255 255 255 / 0.42); box-shadow: 0 0 0 1px rgb(0 0 0 / 0.1); }
  .modulex-zaman-hikaye-dolgu { display: block; width: calc(var(--p, 0) * 100%); height: 100%; background-color: white; }
  .modulex-zaman-hikaye-kontrol { display: flex; align-items: center; justify-content: center; gap: 12px; margin-block-start: 16px; }
  .modulex-zaman-hikaye-dugmek { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1.5px solid --cizgi--; border-radius: 50%; background-color: --bg--; color: --text--; transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
  .modulex-zaman-hikaye-dugmek:hover { border-color: --accent--; background-color: --accent--; color: --accentText--; }
  .modulex-zaman-hikaye-dugmek--dur { width: 54px; height: 54px; border-color: --text--; background-color: --text--; color: --bg--; }
  .modulex-zaman-hikaye-sayac { min-width: 5ch; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }
  @keyframes modulex-zaman-hikaye-kare { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
  @media (max-width: 768px) {
    .modulex-zaman-hikaye--js .modulex-zaman-hikaye-hikaye { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .modulex-zaman-hikaye--js .modulex-zaman-hikaye-halkalar, .modulex-zaman-hikaye--js .modulex-zaman-hikaye-oynatici { grid-column: 1; grid-row: auto; }
    .modulex-zaman-hikaye-halkalar { display: flex; gap: 6px; overflow-x: auto; padding-block: 4px; scrollbar-width: none; }
    .modulex-zaman-hikaye-halkalar > li { flex: none; }
    .modulex-zaman-hikaye-halka { flex-direction: column; gap: 6px; width: 84px; padding: 6px 4px; text-align: center; }
    .modulex-zaman-hikaye-halka[aria-current] { box-shadow: none; }
    .modulex-zaman-hikaye-hbaslik { display: none; }
    .modulex-zaman-hikaye-hmetin { justify-items: center; }
  }
  .modulex-zaman-hikaye-bag { color: inherit; text-decoration: none; }
  .modulex-zaman-hikaye-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-zaman-hikaye-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-hikaye :is(.modulex-zaman-hikaye-baslik, .modulex-zaman-hikaye-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-hikaye-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-zaman-hikaye { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-zaman-hikaye *, .modulex-zaman-hikaye *::before, .modulex-zaman-hikaye *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-zaman-hikaye";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const hikayeOynat = (s, P, az) => {
        const kok = s.querySelector("[data-hikaye]");
        const K = kok ? [...kok.querySelectorAll("." + P + "-kare")] : [];
        if (K.length < 2) return;
        s.classList.add(P + "--js");
        kok.querySelectorAll("[data-hk-js]").forEach((e) => { e.hidden = false; });
        const H = [...kok.querySelectorAll("[data-hk-git]")];
        const S = [...kok.querySelectorAll("." + P + "-serit")];
        const dur = kok.querySelector('[data-hk="dur"]');
        const dIkon = dur && dur.querySelector("[data-hk-ikon]");
        const sira = kok.querySelector("[data-hk-sira]");
        const oyn = kok.querySelector("." + P + "-oynatici");
        let nf = null;
        try { nf = new Intl.NumberFormat(document.documentElement.lang || undefined); } catch (x) { nf = null; }
        const say = (v) => (nf ? nf.format(v) : String(v));
        const SURE = 6000;
        let i = 0;
        let gecen = 0;
        let bas = 0;
        let raf = 0;
        let akar = false;
        let durdu = !!az;
        let ustte = false;
        let gorunur = !("IntersectionObserver" in window);
        const ciz = () => {
          const p = Math.min(1, (gecen + (akar ? performance.now() - bas : 0)) / SURE);
          if (S[i]) S[i].style.setProperty("--p", p.toFixed(3));
          return p;
        };
        const sec = (n) => {
          i = (n + K.length) % K.length;
          gecen = 0;
          bas = performance.now();
          K.forEach((k, j) => { k.hidden = j !== i; });
          H.forEach((h, j) => {
            if (j === i) h.setAttribute("aria-current", "true"); else h.removeAttribute("aria-current");
            h.classList.toggle(P + "--goruldu", j < i);
          });
          S.forEach((e, j) => { e.style.setProperty("--p", j < i || (az && j === i) ? "1" : "0"); });
          if (sira) sira.textContent = say(i + 1) + " / " + say(K.length);
          if (akar) { cancelAnimationFrame(raf); raf = requestAnimationFrame(dongu); }
        };
        const dongu = () => { if (ciz() >= 1) { sec(i + 1); return; } raf = requestAnimationFrame(dongu); };
        const akis = () => {
          const yeni = !durdu && !ustte && gorunur;
          if (yeni === akar) return;
          if (akar) { gecen += performance.now() - bas; cancelAnimationFrame(raf); }
          akar = yeni;
          if (akar) { bas = performance.now(); raf = requestAnimationFrame(dongu); }
        };
        const yaz = () => {
          if (!dur) return;
          dur.setAttribute("aria-label", (durdu ? dur.dataset.oynat : dur.dataset.dur) || "");
          if (dIkon) dIkon.textContent = durdu ? "play_arrow" : "pause";
          kok.classList.toggle(P + "--durdu", durdu);
        };
        kok.addEventListener("click", (e) => {
          const b = e.target.closest("[data-hk], [data-hk-git]");
          if (!b || !kok.contains(b)) return;
          if (b.dataset.hkGit != null) sec(Number(b.dataset.hkGit));
          else if (b.dataset.hk === "ileri") sec(i + 1);
          else if (b.dataset.hk === "geri") sec(i - 1);
          else if (b.dataset.hk === "dur") { durdu = !durdu; yaz(); akis(); }
        });
        kok.addEventListener("keydown", (e) => {
          if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
          const rtl = getComputedStyle(kok).direction === "rtl";
          e.preventDefault();
          sec(i + ((e.key === "ArrowRight") !== rtl ? 1 : -1));
        });
        if (oyn) {
          oyn.addEventListener("pointerenter", () => { ustte = true; akis(); });
          oyn.addEventListener("pointerleave", () => { ustte = false; akis(); });
        }
        kok.addEventListener("focusin", () => { ustte = true; akis(); });
        kok.addEventListener("focusout", (e) => { if (!kok.contains(e.relatedTarget)) { ustte = false; akis(); } });
        if ("IntersectionObserver" in window) {
          new IntersectionObserver((g) => { gorunur = g.some((x) => x.isIntersecting); akis(); }, { threshold: 0.35 }).observe(kok);
        }
        yaz();
        sec(0);
        akis();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      hikayeOynat(s, P, az);
    });
  })();
</script>
