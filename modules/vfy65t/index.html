  .modulex-sayac-pasaport-damga-pasaport { position: relative; padding: clamp(26px, 4vw, 54px); border: 1px solid --cizgi--; border-radius: 14px; background: repeating-radial-gradient(circle at 50% 120%, transparent 0 14px, color-mix(in srgb, --accent-- 7%, transparent) 14px 15px), --kartBg--; box-shadow: 0 30px 60px -45px color-mix(in srgb, --text-- 60%, transparent); }
  .modulex-sayac-pasaport-damga-pasaport::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: calc(50% - 1px); width: 2px; background: linear-gradient(180deg, transparent, --cizgi-- 15% 85%, transparent); box-shadow: 6px 0 14px color-mix(in srgb, --text-- 8%, transparent); }

  .modulex-sayac-pasaport-damga--hazir:not(.modulex-sayac-pasaport-damga--gor) .modulex-sayac-pasaport-damga-murekkep { transform: rotate(var(--r)) scale(1.7); visibility: hidden; }

  .modulex-sayac-pasaport-damga-damga--kare .modulex-sayac-pasaport-damga-murekkep { border-radius: 8px; outline: 1.5px dashed --accentInk--; outline-offset: -11px; }
  .modulex-sayac-pasaport-damga-damga--oval .modulex-sayac-pasaport-damga-murekkep { width: 224px; aspect-ratio: 1.4; border-radius: 50%; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-pasaport-damga :is(.modulex-sayac-pasaport-damga-baslik, .modulex-sayac-pasaport-damga-ust, h3, h4, strong) { letter-spacing: 0; }

  @media (prefers-reduced-motion: reduce) {

  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-pasaport-damga";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
